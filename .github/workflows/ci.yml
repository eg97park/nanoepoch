name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The runner images are in active churn (the Visual Studio 2026 migration ran
  # from June to September 2026). A weekly run separates "we broke it" from
  # "GitHub changed the image" without waiting for the next pull request.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# These jobs run npm lifecycle scripts and root containers over the checkout.
# None of them needs to write anything back to the repository.
permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  # Pinned so the container jobs below, which have no Node of their own, all
  # fetch the same one.
  BUILD_NODE_VERSION: v24.19.0

jobs:
  test:
    name: test ${{ matrix.label }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: win-x64, os: windows-latest, node: '22' }
          - { label: win-x64, os: windows-latest, node: '24' }
          - { label: win-x64, os: windows-latest, node: '26' }
          - { label: win-arm64, os: windows-11-arm, node: '24' }
          - { label: win-arm64, os: windows-11-arm, node: '26' }
          - { label: linux-x64, os: ubuntu-24.04, node: '22' }
          - { label: linux-x64, os: ubuntu-24.04, node: '24' }
          - { label: linux-x64, os: ubuntu-24.04, node: '26' }
          - { label: linux-arm64, os: ubuntu-24.04-arm, node: '24' }
          - { label: linux-arm64, os: ubuntu-24.04-arm, node: '26' }
          # macOS entered the prebuild matrix in 0.3.0, so the source build it
          # used to get only through an install script now needs real coverage.
          - { label: darwin-arm64, os: macos-latest, node: '24' }
          - { label: darwin-arm64, os: macos-latest, node: '26' }
          - { label: darwin-x64, os: macos-15-intel, node: '24' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Install and build are two steps on purpose. `"gypfile": false` already
      # stops npm from compiling this repository's binding.gyp implicitly, so
      # the build has to be explicit anyway -- and being explicit is what puts
      # the pinned node-gyp ^13 devDependency in charge rather than whichever
      # version npm bundles (10.x on the Node 22 line, which cannot detect
      # Visual Studio 2026). --ignore-scripts keeps that true even if the
      # manifest ever loses `"gypfile": false`, which is the failure the release
      # gate exists to catch.
      - run: npm ci --ignore-scripts
      # windows-latest carries Visual Studio 2026 as of June 2026, and node-gyp
      # 12.0.x cannot detect it ("unknown version").
      - name: Check the node-gyp in use knows Visual Studio 2026
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(npx node-gyp --version | tr -d 'v')
          echo "node-gyp $version"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number)
            if (major < 12 || (major === 12 && minor < 1)) {
              console.error("node-gyp " + process.argv[1] + " cannot detect Visual Studio 2026")
              process.exit(1)
            }
          ' "$version"
      - run: npm run dev:build
      - run: npm test
      # Windows only. MSVC does not enable /guard:cf on its own -- node's
      # config.gypi explicitly sets control_flow_guard to "false" -- so unlike
      # the Linux runners, a local build here proves the binding.gyp flag really
      # reached the compiler and the linker. The Linux equivalent runs against
      # the container-built artifacts in prebuild-linux-x64.
      - name: Control Flow Guard must survive the build
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/check-hardening.mjs build/Release/nanoepoch.node --as win32-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

  test-musl:
    name: test linux-x64-musl / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apk add --no-cache build-base python3
      # Two steps for the same reason as the job above: build through the pinned
      # node-gyp devDependency, not through npm's implicit invocation.
      - run: npm ci --ignore-scripts
      - run: npm run dev:build
      - run: npm test

  test-musl-arm64:
    name: test linux-arm64-musl / node 24
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run Alpine through `docker run` rather than as a container job: the
      # runner cannot inject a musl-arm64 Node, so JavaScript actions such as
      # checkout fail inside an arm64 Alpine container.
      - name: Build and test in Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work node:24-alpine sh -c '
            apk add --no-cache build-base python3 &&
            npm ci --ignore-scripts --no-audit --no-fund &&
            npm run dev:build &&
            npm test
          '

  types:
    name: types resolve for both entries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # attw packs the tarball and reads the declarations; nothing here needs a
      # compiled addon, so skip the build the repository's binding.gyp would
      # otherwise trigger.
      - run: npm ci --ignore-scripts
      # attw is fetched here rather than declared as a devDependency: it brings
      # 53 packages for a check that runs in exactly one job, and installing it
      # for every contributor and every other job is the larger cost. The
      # version is pinned in the npm script.
      - name: Pack and check the published type declarations
        run: npm run attw

  prebuild-linux-x64:
    name: prebuild linux-x64 (glibc + musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built against glibc 2.28, the same floor the official Node binaries
      # require, so anything that can run a supported Node can load this.
      - name: Build the glibc prebuild
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e NODE_VERSION="$BUILD_NODE_VERSION" \
            quay.io/pypa/manylinux_2_28_x86_64 bash scripts/build-prebuild.sh
      - name: Build the musl prebuild
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            node:24-alpine sh scripts/build-prebuild.sh
      - name: Show what was produced
        run: find prebuilds build-info -type f -exec ls -l {} +
      # The hardening check belongs HERE and not on the test matrix. Ubuntu's
      # GCC already applies -fstack-protector-strong and relro by default, and
      # Alpine's adds BIND_NOW and a canary on top, so checking a local
      # `npm run dev:build` on those runners would go green whether or not
      # binding.gyp had any effect at all. These two are the real manylinux and
      # Alpine artifacts -- the same containers the release builds in -- so a
      # flag that stops taking is visible on the pull request that breaks it
      # rather than on the tag.
      - name: The shipped Linux binaries must be hardened as binding.gyp asks
        run: |
          node scripts/check-hardening.mjs prebuilds/linux-x64/nanoepoch.glibc.node --as linux-x64-glibc
          node scripts/check-hardening.mjs prebuilds/linux-x64/nanoepoch.musl.node --as linux-x64-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilds-linux-x64
          path: prebuilds/
          if-no-files-found: error

  install-proof:
    name: install without a toolchain (${{ matrix.image }})
    needs: prebuild-linux-x64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [node:22-alpine, node:24-alpine, node:26-alpine, node:22-slim, node:24-slim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilds-linux-x64
          path: prebuilds/
      # Pack the real tarball rather than testing the checkout: this also
      # catches a "files" whitelist that forgot to ship prebuilds/.
      - name: Pack the publishable tarball
        run: |
          npm pack --pack-destination /tmp
          mv /tmp/nanoepoch-*.tgz /tmp/nanoepoch.tgz
          tar tzf /tmp/nanoepoch.tgz | sort
      - name: Install and use it with no compiler present
        run: |
          docker run --rm -v /tmp/nanoepoch.tgz:/tmp/nanoepoch.tgz ${{ matrix.image }} sh -c '
            set -e

            # Assert the precondition instead of assuming it: if these images
            # ever ship a compiler, this proof is void and should say so.
            for tool in gcc g++ cc make python3 node-gyp; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "PRECONDITION FAILED: $tool is present, so this image cannot prove a toolchain-free install"
                exit 1
              fi
            done

            mkdir -p /app && cd /app && npm init -y >/dev/null

            echo "--- install with lifecycle scripts enabled ---"
            npm install /tmp/nanoepoch.tgz --no-audit --no-fund
            # A source build cannot happen without leaving build/ behind.
            if [ -d node_modules/nanoepoch/build ]; then
              echo "FAILED: node_modules/nanoepoch/build exists, so something compiled"
              exit 1
            fi
            node -e "
              const { now } = require(\"nanoepoch\");
              const v = now();
              if (typeof v !== \"bigint\" || v < 1750000000000000000n || v > 4000000000000000000n) {
                throw new Error(\"implausible timestamp: \" + v)
              }
              console.log(\"ok, scripts enabled:\", v)
            "

            echo "--- install with --ignore-scripts ---"
            rm -rf node_modules package-lock.json
            npm install /tmp/nanoepoch.tgz --ignore-scripts --no-audit --no-fund
            node -e "console.log(\"ok, scripts ignored:\", require(\"nanoepoch\").now())"

            # The package ships one test file so that `npm test` in an installed
            # tree means something. Running it here is what turns the tarball
            # from "it required without throwing" into "its own contract holds
            # against the bytes that shipped". The pass-count grep is the point:
            # `node --test` exits 0 when it finds no tests at all, which is the
            # vacuous green this file exists to prevent.
            echo "--- the shipped self-test ---"
            cd node_modules/nanoepoch
            npm test
            node --test --test-reporter=tap test/smoke.test.mjs > /tmp/tap.txt 2>&1 || { cat /tmp/tap.txt; exit 1; }
            grep -qE "^# pass [1-9][0-9]*\$" /tmp/tap.txt || { echo "FAILED: the shipped self-test ran no tests"; cat /tmp/tap.txt; exit 1; }
            grep -qE "^# fail 0\$" /tmp/tap.txt || { echo "FAILED: the shipped self-test reported failures"; cat /tmp/tap.txt; exit 1; }
            cd /app

            echo "--- negative control: no binary must mean a loud failure ---"
            rm -rf node_modules/nanoepoch/prebuilds node_modules/nanoepoch/build
            if node -e "require(\"nanoepoch\")" 2>/tmp/err; then
              echo "FAILED: loading succeeded with no native binary present"
              exit 1
            fi
            grep -q "no JavaScript fallback" /tmp/err || { echo "FAILED: error message lost its no-fallback statement"; cat /tmp/err; exit 1; }
            grep -q "detected" /tmp/err || { echo "FAILED: error message lost the detected platform"; cat /tmp/err; exit 1; }
            echo "ok, failed loudly:"; head -8 /tmp/err
          '

  glibc-floor:
    name: shipped binary loads on glibc 2.28
    needs: prebuild-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilds-linux-x64
          path: prebuilds/
      # AlmaLinux 8 is the same lineage as the manylinux_2_28 build image, so
      # this exercises the exact glibc floor the README advertises. Debian 11
      # would not: it ships glibc 2.31.
      - name: Load the prebuilt binary on AlmaLinux 8
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e NODE_VERSION="$BUILD_NODE_VERSION" almalinux:8 bash -c '
            set -e
            ldd --version | head -1
            curl -fsSLO "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-linux-x64.tar.xz"
            curl -fsSLO "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt"
            grep " node-$NODE_VERSION-linux-x64.tar.xz$" SHASUMS256.txt | sha256sum -c -
            mkdir -p /opt/node && tar xf node-*.tar.xz -C /opt/node --strip-components=1
            export PATH=/opt/node/bin:$PATH
            # No npm install: the package has zero runtime dependencies, so
            # index.js plus the shipped binary must load with nothing else.
            test ! -d build
            node -e "console.log(\"loaded the shipped binary:\", require(\"./index.js\").now())"
          '

  clock-step:
    name: a backward clock step is observed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run dev:build
      - name: Step the clock backwards and check who notices
        run: bash scripts/clock-step/run.sh
      # The README quotes this benchmark's output and tells readers to run it.
      # Nothing else executes it, so its mitata dependency would rot silently
      # and the reproduction instruction would quietly become false. Non-gating:
      # a shared runner's timing numbers are not something to fail a build over,
      # only the fact that the script still runs.
      - name: The benchmark the README quotes must still run
        continue-on-error: true
        run: npm run bench

  legacy-node-smoke:
    name: node 20 consumer smoke
    needs: prebuild-linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilds-linux-x64
          path: prebuilds/
      - run: npm pack --pack-destination /tmp
      # package.json says engines >= 20, so prove the path a Node 20 consumer
      # actually takes: install the tarball with no devDependencies and load the
      # prebuilt binary. Building from source is NOT that path -- node-gyp 13
      # does not support Node 20 -- and testing it would fail for a reason no
      # consumer would ever hit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install and load on Node 20
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install /tmp/nanoepoch-*.tgz --omit=dev --no-audit --no-fund
          test ! -d node_modules/nanoepoch/build
          node -e '
            const { now, nowMicros, nowInto } = require("nanoepoch")
            const v = now()
            if (typeof v !== "bigint" || v < 1750000000000000000n || v > 4000000000000000000n) {
              throw new Error("implausible timestamp: " + v)
            }
            const buffer = new BigUint64Array(1)
            nowInto(buffer)
            console.log("node 20 consumer path ok:", v, nowMicros(), buffer[0])
          '
      # The only Node 20 job there is, so it is also the only place the shipped
      # self-test is exercised on the engines floor -- where `node --test`'s
      # file discovery is least like the version everything else runs.
      - name: The shipped self-test runs on the engines floor
        run: |
          cd /tmp/consumer/node_modules/nanoepoch
          npm test
          node --test --test-reporter=tap test/smoke.test.mjs > /tmp/tap.txt 2>&1 || { cat /tmp/tap.txt; exit 1; }
          grep -qE '^# pass [1-9][0-9]*$' /tmp/tap.txt || { echo "the shipped self-test ran no tests"; cat /tmp/tap.txt; exit 1; }
          grep -qE '^# fail 0$' /tmp/tap.txt || { echo "the shipped self-test reported failures"; cat /tmp/tap.txt; exit 1; }

  runtime-smoke:
    name: ${{ matrix.runtime }} smoke (non-gating)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, electron]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run dev:build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      # Electron bundles its own Node with a different V8 ABI; loading the same
      # binary there without a rebuild is exactly what the Node-API 6 choice
      # bought. ELECTRON_RUN_AS_NODE runs that bundled runtime headless, so no
      # display server is needed.
      - name: Install Electron
        if: matrix.runtime == 'electron'
        run: npm install --no-save electron
      # `deno run` has no -e, and `deno eval` takes no --allow-* flags: it runs
      # with every permission already granted, so passing them is an error.
      - name: Load the addon and call every export
        run: |
          snippet='const b = new BigUint64Array(1); nowInto(b); console.log("now", now(), "micros", nowMicros(), "into", b[0])'
          case "${{ matrix.runtime }}" in
            bun)
              bun -e "const { now, nowMicros, nowInto } = require('./index.js'); $snippet" ;;
            deno)
              deno eval "import { now, nowMicros, nowInto } from './index.js'; $snippet" ;;
            electron)
              node -e 'console.log("electron", require("electron/package.json").version, "bundles Node", require("child_process").execFileSync(require("electron"), ["-e", "console.log(process.versions.node + \" ABI \" + process.versions.modules)"], {encoding: "utf8", env: {...process.env, ELECTRON_RUN_AS_NODE: "1"}}).trim())'
              ELECTRON_RUN_AS_NODE=1 "$(node -e 'process.stdout.write(require("electron"))')" -e "const { now, nowMicros, nowInto } = require('./index.js'); $snippet" ;;
          esac

  # The single check the branch ruleset requires.
  #
  # Registering the expanded job names instead would mean registering 27 of
  # them, and 24 carry a Node version or an image tag in the name: dropping the
  # Node 22 row leaves five stale entries that never report, and a required
  # check that never reports blocks every merge in the repository until an
  # administrator edits the ruleset. Adding a Node 28 row has the opposite
  # failure -- the new names are simply not required, so they gate nothing.
  # Both land on the pull request doing the version bump. `needs:` refers to job
  # ids, which version bumps do not touch.
  #
  # `if: always()` is load-bearing. Without it, a failed dependency SKIPS this
  # job, and GitHub reports a skipped job to branch protection as a SUCCESS --
  # the gate would go green exactly when CI is red. For the same reason the step
  # below rejects every result that is not "success", not just "failure":
  # install-proof, glibc-floor and legacy-node-smoke all sit behind
  # `needs: prebuild-linux-x64`, so "skipped" is a state they really reach.
  #
  # runtime-smoke is deliberately absent: it is continue-on-error and must not
  # block a merge. test/ci-required.test.mjs asserts that this list stays equal
  # to "every job except that one", so a job added to CI cannot quietly end up
  # ungated.
  ci-required:
    # This string is the ruleset entry. Renaming it removes the gate silently.
    name: ci-required
    if: always()
    needs:
      - test
      - test-musl
      - test-musl-arm64
      - types
      - prebuild-linux-x64
      - install-proof
      - glibc-floor
      - clock-step
      - legacy-node-smoke
    # Pinned rather than ubuntu-latest: this job decides whether anything can
    # merge, so it should be the last thing a runner image migration touches.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Only to read this repository's own code for the checkout below.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every required job must have succeeded
        env:
          # Through the environment rather than interpolated into the script: a
          # job cannot ask GitHub for its own dependencies, so the workflow has
          # to hand them over.
          RESULTS: ${{ toJSON(needs) }}
        # A script rather than an inline `node -e`, because this is the one
        # check standing between a red CI and a merged pull request, and logic
        # buried in YAML cannot be tested. test/ci-required.test.mjs exercises
        # it against every result GitHub can report.
        run: node scripts/ci-required.mjs
